[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Personal AI assistant with LangGraph and LangChain"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.1.0",
    "langchain-openai",
    "langchain-mcp-adapters",
    "langgraph",
    "openai",
    "cryptography",
    "python-dotenv",
    "mcp",
    "fastapi",
    "uvicorn[standard]",
    "requests",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "pandas",
    "python-dateutil",
    "PyJWT",
    "firebase-admin",
    "gradio>=5.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
examples = [
    "langchain-ollama>=1.1.0",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true
